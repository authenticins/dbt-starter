name: attio_analytics
version: "1.0.0"
config-version: 2
profile: attio_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Where Fivetran puts the raw Attio data. This is read only for you.
  attio_database: FIVETRAN_DATABASE
  attio_schema: ATTIO
  # Range for the MetricFlow time spine
  time_spine_start: "2020-01-01"

models:
  attio_analytics:
    # Every model is built in your one sandbox schema (see
    # macros/generate_schema_name.sql). Name prefixes (stg_, int_, fct_, dim_)
    # show which layer a model belongs to.
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    semantic:
      +materialized: table
