version: 2

sources:
  - name: attio
    description: Raw Attio CRM data that Fivetran syncs. You can read it but not change it.
    database: "{{ var('attio_database') }}"
    schema: "{{ var('attio_schema') }}"
    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: {count: 24, period: hour}

    # Fill in this list by running:
    #   dbt run-operation list_attio_tables
    #   dbt run-operation generate_source --args '{"schema_name": "ATTIO", "database_name": "FIVETRAN_DATABASE", "generate_columns": true}'
    # Then paste the generated `tables:` block here, replacing the empty list.
    tables: []
